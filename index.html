<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Placement Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="nav" id="nav"></header>
    <main id="app"></main>

    <div class="modal" id="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" id="modal-body"></div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- local-backend.js = demo mode without n8n. Set CONFIG.N8N_URL in app.js to use n8n. -->
    <script src="local-backend.js"></script>
    <script src="app.js"></script>
</body>

</html>
